@if (authService.isAuthenticated()) {
  <mat-sidenav-container
    class="app-container"
    [class.sidenav-collapsed]="!isMobile() && sidebarCollapsed()"
  >
    <mat-sidenav
      [mode]="isMobile() ? 'over' : 'side'"
      [opened]="isMobile() ? sidenavOpen() : true"
      (openedChange)="sidenavOpen.set($event)"
    >
      <app-sidebar [collapsed]="!isMobile() && sidebarCollapsed()" />
    </mat-sidenav>

    <mat-sidenav-content>
      <mat-toolbar class="app-toolbar">
        <button mat-icon-button (click)="toggleSidenav()" aria-label="Toggle navigation">
          <mat-icon>menu</mat-icon>
        </button>
        <span class="toolbar-spacer"></span>
        <app-language-switcher />
        <button
          mat-icon-button
          (click)="themeService.toggleTheme()"
          [attr.aria-label]="(themeService.isDark() ? 'nav.lightMode' : 'nav.darkMode') | translate"
        >
          <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>
        <button mat-icon-button [matMenuTriggerFor]="userMenu" [attr.aria-label]="'nav.userMenu' | translate">
          <mat-icon>account_circle</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu">
          <div class="user-menu-header" mat-menu-item disabled>
            <span class="user-menu-name">{{ userDisplayName() }}</span>
          </div>
          <a mat-menu-item routerLink="/profile">
            <mat-icon>person</mat-icon>
            <span>{{ 'nav.profile' | translate }}</span>
          </a>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>{{ 'nav.logout' | translate }}</span>
          </button>
        </mat-menu>
      </mat-toolbar>

      <main class="main-content">
        <router-outlet />
      </main>

      <!--
        Rendered by the shell, not by a route: an import runs for tens of minutes
        and its progress has to stay reachable wherever the user navigates.

        Deferred because it is idle almost always — loading it eagerly put the
        import service graph and Material's dialog and progress bar in the
        initial bundle, for a screen only admins ever open.
      -->
      @defer (when importStatus.visible()) {
        <app-import-progress />
      }
    </mat-sidenav-content>
  </mat-sidenav-container>
} @else {
  <router-outlet />
}
