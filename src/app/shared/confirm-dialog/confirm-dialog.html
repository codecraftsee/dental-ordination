<div class="confirm-dialog">
  <div class="confirm-dialog__header">
    <h2 mat-dialog-title>{{ data.title }}</h2>
    <div class="confirm-dialog__icon-wrap" [class.confirm-dialog__icon-wrap--warning]="data.iconColor === 'warning'">
      <mat-icon aria-hidden="true">{{ data.icon ?? 'warning' }}</mat-icon>
    </div>
  </div>

  <mat-dialog-content class="confirm-dialog__body">
    <p>{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions class="confirm-dialog__actions">
    <button matButton="outlined" (click)="cancel()">{{ 'common.no' | translate }}</button>
    <button matButton="elevated" color="warn" (click)="confirm()" cdkFocusInitial>
      {{ 'common.yes' | translate }}
    </button>
  </mat-dialog-actions>
</div>
